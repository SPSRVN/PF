<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <!-- Seamless C# Developer Logo -->
    <g id="csharp-logo">
      <!-- Outer Hexagon -->
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" opacity="0.95"/>
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="2,3" opacity="0.45"/>
      <!-- 'C' Shape -->
      <path d="M 2,-12 A 13,13 0 1 0 2,12 L 2,7.5 A 8.5,8.5 0 1 1 2,-7.5 Z" fill="#ffffff" opacity="0.95"/>
      <!-- '#' Sharp Symbol -->
      <line x1="8" y1="-10" x2="6.5" y2="10" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="14" y1="-10" x2="12.5" y2="10" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="3.5" y1="-3.5" x2="17" y2="-3.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="3.5" y1="3.5" x2="17" y2="3.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Official Unity 3D Engine Logo -->
    <g id="unity-logo">
      <!-- Outer Unity Tri-Arrow Arrows -->
      <!-- Top-Right Arrow -->
      <path d="M 4,-7 L 16,-14 L 16,-22 L 24,-17 L 24,-6 L 15,-1 L 7,-5 Z" fill="#ffffff" opacity="0.95"/>
      <!-- Top-Left Arrow -->
      <path d="M -4,-7 L -16,-14 L -16,-22 L -24,-17 L -24,-6 L -15,-1 L -7,-5 Z" fill="#ffffff" opacity="0.95"/>
      <!-- Bottom Arrow -->
      <path d="M -6,4 L -6,18 L 0,22 L 6,18 L 6,4 L 0,8 Z" fill="#ffffff" opacity="0.95"/>
      <!-- Central Cube Connector -->
      <polygon points="0,-4 5,-1 5,4 0,7 -5,4 -5,-1" fill="#ffffff" opacity="0.75"/>
      <!-- Outer Hexagon Tech Accent -->
      <polygon points="0,-27 23.4,-13.5 23.4,13.5 0,27 -23.4,13.5 -23.4,-13.5" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.4"/>
    </g>

    <!-- Tech Hologram Spatial Anchor Dot -->
    <g id="holo-node">
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" opacity="0.5"/>
      <circle cx="0" cy="0" r="5" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="1.5,3" opacity="0.3"/>
    </g>
  </defs>

  <!-- Background Base -->
  <rect width="300" height="300" fill="#000000"/>

  <!-- Subtle Ambient Diagonal Mesh -->
  <path d="M 0,0 L 300,300 M 300,0 L 0,300" stroke="#ffffff" stroke-width="0.4" stroke-dasharray="1,9" opacity="0.12"/>
  <path d="M 150,0 L 150,300 M 0,150 L 300,150" stroke="#ffffff" stroke-width="0.4" stroke-dasharray="2,8" opacity="0.1"/>

  <!-- ==================== ROW 1 (y = 0) ==================== -->
  <!-- Corners: Unity Logo -->
  <g transform="translate(0, 0)"><use href="#unity-logo"/></g>
  <g transform="translate(300, 0)"><use href="#unity-logo"/></g>
  <!-- Midpoint: C# Logo -->
  <g transform="translate(150, 0)"><use href="#csharp-logo"/></g>

  <!-- ==================== ROW 2 (y = 75) ==================== -->
  <g transform="translate(75, 75)"><use href="#csharp-logo"/></g>
  <g transform="translate(225, 75)"><use href="#unity-logo"/></g>

  <!-- ==================== ROW 3 (y = 150) ==================== -->
  <!-- Left/Right: Unity Logo -->
  <g transform="translate(0, 150)"><use href="#unity-logo"/></g>
  <g transform="translate(300, 150)"><use href="#unity-logo"/></g>
  <!-- Center: C# Logo -->
  <g transform="translate(150, 150)"><use href="#csharp-logo"/></g>

  <!-- ==================== ROW 4 (y = 225) ==================== -->
  <g transform="translate(75, 225)"><use href="#unity-logo"/></g>
  <g transform="translate(225, 225)"><use href="#csharp-logo"/></g>

  <!-- ==================== ROW 5 (y = 300) ==================== -->
  <!-- Corners: Unity Logo -->
  <g transform="translate(0, 300)"><use href="#unity-logo"/></g>
  <g transform="translate(300, 300)"><use href="#unity-logo"/></g>
  <!-- Midpoint: C# Logo -->
  <g transform="translate(150, 300)"><use href="#csharp-logo"/></g>

  <!-- Subtle Spatial Nodes for Hologram Depth -->
  <g transform="translate(75, 0)"><use href="#holo-node"/></g>
  <g transform="translate(225, 0)"><use href="#holo-node"/></g>
  <g transform="translate(75, 150)"><use href="#holo-node"/></g>
  <g transform="translate(225, 150)"><use href="#holo-node"/></g>
  <g transform="translate(75, 300)"><use href="#holo-node"/></g>
  <g transform="translate(225, 300)"><use href="#holo-node"/></g>
  <g transform="translate(0, 75)"><use href="#holo-node"/></g>
  <g transform="translate(150, 75)"><use href="#holo-node"/></g>
  <g transform="translate(300, 75)"><use href="#holo-node"/></g>
  <g transform="translate(0, 225)"><use href="#holo-node"/></g>
  <g transform="translate(150, 225)"><use href="#holo-node"/></g>
  <g transform="translate(300, 225)"><use href="#holo-node"/></g>
</svg>
