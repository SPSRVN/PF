<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <!-- C# Developer Logo -->
    <g id="csharp-logo">
      <!-- Outer Hexagon -->
      <polygon points="0,-34 29.4,-17 29.4,17 0,34 -29.4,17 -29.4,-17" fill="none" stroke="#ffffff" stroke-width="3.0" stroke-linejoin="round" opacity="0.95"/>
      <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-dasharray="3,4" opacity="0.5"/>
      <!-- 'C' Shape -->
      <path d="M 4,-16 A 16,16 0 1 0 4,16 L 4,10 A 10,10 0 1 1 4,-10 Z" fill="#ffffff" opacity="0.95"/>
      <!-- '#' Sharp Symbol -->
      <line x1="11" y1="-13" x2="9" y2="13" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="19.5" y1="-13" x2="17.5" y2="13" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="5.5" y1="-5" x2="23" y2="-5" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="5.5" y1="5" x2="23" y2="5" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- Official Modern Unity 3D Isometric Cube Logo -->
    <g id="unity-logo">
      <!-- Top Isometric Face -->
      <path d="M -3.0,-35.0 L -31.5,-18.2 L 0.0,0.0 L 31.5,-18.2 L 3.0,-35.0 L 3.0,-23.5 L 14.1,-18.2 L 0.0,-9.4 L -14.1,-18.2 L -3.0,-23.5 Z" fill="#ffffff" opacity="0.95"/>
      <!-- Left Isometric Face -->
      <path d="M -28.9,20.1 L 0.0,36.4 L 0.0,0.0 L -31.5,-18.2 L -31.8,14.9 L -21.9,9.2 L -22.8,-3.1 L -8.2,4.7 L -8.7,21.3 L -18.9,14.4 Z" fill="#ffffff" opacity="0.82"/>
      <!-- Right Isometric Face -->
      <path d="M 31.8,14.9 L 31.5,-18.2 L 0.0,0.0 L 0.0,36.4 L 28.9,20.1 L 18.9,14.4 L 8.7,21.3 L 8.2,4.7 L 22.8,-3.1 L 21.9,9.2 Z" fill="#ffffff" opacity="0.95"/>
      <!-- Outer Hexagon Tech Accent -->
      <polygon points="0,-39 33.7,-19.5 33.7,19.5 0,39 -33.7,19.5 -33.7,-19.5" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-dasharray="4,5" opacity="0.4"/>
    </g>

    <!-- Tech Hologram Spatial Anchor Dot -->
    <g id="holo-node">
      <circle cx="0" cy="0" r="2.0" fill="#ffffff" opacity="0.6"/>
      <circle cx="0" cy="0" r="7.0" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-dasharray="2,3" opacity="0.35"/>
    </g>
  </defs>

  <!-- Transparent Background for Pure Alpha Channel Masking -->

  <!-- Subtle Ambient Diagonal Mesh -->
  <path d="M 0,0 L 360,360 M 360,0 L 0,360" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="3,10" opacity="0.18"/>
  <path d="M 180,0 L 180,360 M 0,180 L 360,180" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="3,10" opacity="0.15"/>

  <!-- ==================== ROW 1 (y = 0): UNITY - C# - UNITY ==================== -->
  <g transform="translate(0, 0)"><use href="#unity-logo"/></g>
  <g transform="translate(180, 0)"><use href="#csharp-logo"/></g>
  <g transform="translate(360, 0)"><use href="#unity-logo"/></g>

  <!-- ==================== ROW 2 (y = 180): C# - UNITY - C# ==================== -->
  <g transform="translate(0, 180)"><use href="#csharp-logo"/></g>
  <g transform="translate(180, 180)"><use href="#unity-logo"/></g>
  <g transform="translate(360, 180)"><use href="#csharp-logo"/></g>

  <!-- ==================== ROW 3 (y = 360): UNITY - C# - UNITY ==================== -->
  <g transform="translate(0, 360)"><use href="#unity-logo"/></g>
  <g transform="translate(180, 360)"><use href="#csharp-logo"/></g>
  <g transform="translate(360, 360)"><use href="#unity-logo"/></g>

  <!-- Spatial Nodes for Tech Grid Depth -->
  <g transform="translate(90, 90)"><use href="#holo-node"/></g>
  <g transform="translate(270, 90)"><use href="#holo-node"/></g>
  <g transform="translate(90, 270)"><use href="#holo-node"/></g>
  <g transform="translate(270, 270)"><use href="#holo-node"/></g>
</svg>
