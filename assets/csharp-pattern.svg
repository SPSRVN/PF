<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <!-- Large, Spacious C# Developer Logo -->
    <g id="csharp-logo">
      <!-- Outer Hexagon -->
      <polygon points="0,-36 31.18,-18 31.18,18 0,36 -31.18,18 -31.18,-18" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linejoin="round" opacity="0.95"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="#ffffff" stroke-width="1.0" stroke-dasharray="3,4" opacity="0.5"/>
      <!-- 'C' Shape -->
      <path d="M 4,-17 A 18,18 0 1 0 4,17 L 4,10.5 A 11.5,11.5 0 1 1 4,-10.5 Z" fill="#ffffff" opacity="0.95"/>
      <!-- '#' Sharp Symbol -->
      <line x1="11.5" y1="-14" x2="9.5" y2="14" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="20.5" y1="-14" x2="18.5" y2="14" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="6" y1="-5.5" x2="24.5" y2="-5.5" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="6" y1="5.5" x2="24.5" y2="5.5" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
    </g>

    <!-- Large, Spacious Modern Unity 3D Isometric Cube Logo -->
    <g id="unity-logo">
      <!-- Top Isometric Face -->
      <path d="M -3.3,-39.0 L -35.07,-20.25 L 0.0,0.0 L 35.07,-20.25 L 3.3,-39.0 L 3.3,-26.25 L 15.75,-20.25 L 0.0,-10.5 L -15.75,-20.25 L -3.3,-26.25 Z" fill="#ffffff" opacity="0.95"/>
      <!-- Left Isometric Face -->
      <path d="M -32.13,22.36 L 0.0,40.5 L 0.0,0.0 L -35.07,-20.25 L -35.43,16.63 L -24.39,10.26 L -25.41,-3.51 L -9.09,5.25 L -9.66,23.76 L -21.09,15.99 Z" fill="#ffffff" opacity="0.82"/>
      <!-- Right Isometric Face -->
      <path d="M 35.43,16.63 L 35.07,-20.25 L 0.0,0.0 L 0.0,40.5 L 32.13,22.36 L 21.09,15.99 L 9.66,23.76 L 9.09,5.25 L 25.41,-3.51 L 24.39,10.26 Z" fill="#ffffff" opacity="0.95"/>
      <!-- Outer Hexagon Tech Accent -->
      <polygon points="0,-43.5 37.5,-21.75 37.5,21.75 0,43.5 -37.5,21.75 -37.5,-21.75" fill="none" stroke="#ffffff" stroke-width="1.0" stroke-dasharray="4,5" opacity="0.4"/>
    </g>

    <!-- Tech Hologram Spatial Anchor Dot -->
    <g id="holo-node">
      <circle cx="0" cy="0" r="2.2" fill="#ffffff" opacity="0.6"/>
      <circle cx="0" cy="0" r="7.5" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.35"/>
    </g>
  </defs>

  <!-- Transparent Background for Pure Alpha Channel Masking -->

  <!-- Subtle Ambient Diagonal Mesh -->
  <path d="M 0,0 L 320,320 M 320,0 L 0,320" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="3,10" opacity="0.18"/>
  <path d="M 160,0 L 160,320 M 0,160 L 320,160" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="3,10" opacity="0.15"/>

  <!-- ==================== ROW 1 (y = 0) ==================== -->
  <!-- Corners: Unity Logo -->
  <g transform="translate(0, 0)"><use href="#unity-logo"/></g>
  <g transform="translate(320, 0)"><use href="#unity-logo"/></g>
  <!-- Midpoint: C# Logo -->
  <g transform="translate(160, 0)"><use href="#csharp-logo"/></g>

  <!-- ==================== ROW 2 (y = 160) ==================== -->
  <!-- Left/Right: Unity Logo -->
  <g transform="translate(0, 160)"><use href="#unity-logo"/></g>
  <g transform="translate(320, 160)"><use href="#unity-logo"/></g>
  <!-- Center: C# Logo -->
  <g transform="translate(160, 160)"><use href="#csharp-logo"/></g>

  <!-- ==================== ROW 3 (y = 320) ==================== -->
  <!-- Corners: Unity Logo -->
  <g transform="translate(0, 320)"><use href="#unity-logo"/></g>
  <g transform="translate(320, 320)"><use href="#unity-logo"/></g>
  <!-- Midpoint: C# Logo -->
  <g transform="translate(160, 320)"><use href="#csharp-logo"/></g>

  <!-- Spatial Nodes for Tech Grid Depth (Spaced 160px apart) -->
  <g transform="translate(80, 80)"><use href="#holo-node"/></g>
  <g transform="translate(240, 80)"><use href="#holo-node"/></g>
  <g transform="translate(80, 240)"><use href="#holo-node"/></g>
  <g transform="translate(240, 240)"><use href="#holo-node"/></g>
</svg>
