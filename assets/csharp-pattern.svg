<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <!-- Seamless C# Developer Logo -->
    <g id="csharp-logo">
      <!-- Outer Hexagon -->
      <polygon points="0,-28 24.2,-14 24.2,14 0,28 -24.2,14 -24.2,-14" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" opacity="0.95"/>
      <polygon points="0,-23 20,-11.5 20,11.5 0,23 -20,11.5 -20,-11.5" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.5"/>
      <!-- 'C' Shape -->
      <path d="M 3,-13 A 14,14 0 1 0 3,13 L 3,8 A 9,9 0 1 1 3,-8 Z" fill="#ffffff" opacity="0.95"/>
      <!-- '#' Sharp Symbol -->
      <line x1="9" y1="-11" x2="7.5" y2="11" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="16" y1="-11" x2="14.5" y2="11" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="4.5" y1="-4" x2="19" y2="-4" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="4.5" y1="4" x2="19" y2="4" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Official Modern Unity 3D Isometric Cube Logo -->
    <g id="unity-logo">
      <!-- Top Isometric Face -->
      <path d="M -2.2,-26.0 L -23.38,-13.5 L 0.0,0.0 L 23.38,-13.5 L 2.2,-26.0 L 2.2,-17.5 L 10.5,-13.5 L 0.0,-7.0 L -10.5,-13.5 L -2.2,-17.5 Z" fill="#ffffff" opacity="0.95"/>
      <!-- Left Isometric Face -->
      <path d="M -21.42,14.91 L 0.0,27.0 L 0.0,0.0 L -23.38,-13.5 L -23.62,11.09 L -16.26,6.84 L -16.94,-2.34 L -6.06,3.5 L -6.44,15.84 L -14.06,10.66 Z" fill="#ffffff" opacity="0.82"/>
      <!-- Right Isometric Face -->
      <path d="M 23.62,11.09 L 23.38,-13.5 L 0.0,0.0 L 0.0,27.0 L 21.42,14.91 L 14.06,10.66 L 6.44,15.84 L 6.06,3.5 L 16.94,-2.34 L 16.26,6.84 Z" fill="#ffffff" opacity="0.95"/>
      <!-- Outer Hexagon Tech Accent -->
      <polygon points="0,-29 25,-14.5 25,14.5 0,29 -25,14.5 -25,-14.5" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.4"/>
    </g>

    <!-- Tech Hologram Spatial Anchor Dot -->
    <g id="holo-node">
      <circle cx="0" cy="0" r="1.8" fill="#ffffff" opacity="0.6"/>
      <circle cx="0" cy="0" r="6" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="2,3" opacity="0.35"/>
    </g>
  </defs>

  <!-- Transparent Background for Pure Alpha Channel Masking -->

  <!-- Subtle Ambient Diagonal Mesh -->
  <path d="M 0,0 L 300,300 M 300,0 L 0,300" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2,8" opacity="0.18"/>
  <path d="M 150,0 L 150,300 M 0,150 L 300,150" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2,8" opacity="0.15"/>

  <!-- ==================== ROW 1 (y = 0) ==================== -->
  <!-- Corners: Unity Logo -->
  <g transform="translate(0, 0)"><use href="#unity-logo"/></g>
  <g transform="translate(300, 0)"><use href="#unity-logo"/></g>
  <!-- Midpoint: C# Logo -->
  <g transform="translate(150, 0)"><use href="#csharp-logo"/></g>

  <!-- ==================== ROW 2 (y = 75) ==================== -->
  <g transform="translate(75, 75)"><use href="#csharp-logo"/></g>
  <g transform="translate(225, 75)"><use href="#unity-logo"/></g>

  <!-- ==================== ROW 3 (y = 150) ==================== -->
  <!-- Left/Right: Unity Logo -->
  <g transform="translate(0, 150)"><use href="#unity-logo"/></g>
  <g transform="translate(300, 150)"><use href="#unity-logo"/></g>
  <!-- Center: C# Logo -->
  <g transform="translate(150, 150)"><use href="#csharp-logo"/></g>

  <!-- ==================== ROW 4 (y = 225) ==================== -->
  <g transform="translate(75, 225)"><use href="#unity-logo"/></g>
  <g transform="translate(225, 225)"><use href="#csharp-logo"/></g>

  <!-- ==================== ROW 5 (y = 300) ==================== -->
  <!-- Corners: Unity Logo -->
  <g transform="translate(0, 300)"><use href="#unity-logo"/></g>
  <g transform="translate(300, 300)"><use href="#unity-logo"/></g>
  <!-- Midpoint: C# Logo -->
  <g transform="translate(150, 300)"><use href="#csharp-logo"/></g>

  <!-- Spatial Nodes for Tech Grid Depth -->
  <g transform="translate(75, 0)"><use href="#holo-node"/></g>
  <g transform="translate(225, 0)"><use href="#holo-node"/></g>
  <g transform="translate(75, 150)"><use href="#holo-node"/></g>
  <g transform="translate(225, 150)"><use href="#holo-node"/></g>
  <g transform="translate(75, 300)"><use href="#holo-node"/></g>
  <g transform="translate(225, 300)"><use href="#holo-node"/></g>
  <g transform="translate(0, 75)"><use href="#holo-node"/></g>
  <g transform="translate(150, 75)"><use href="#holo-node"/></g>
  <g transform="translate(300, 75)"><use href="#holo-node"/></g>
  <g transform="translate(0, 225)"><use href="#holo-node"/></g>
  <g transform="translate(150, 225)"><use href="#holo-node"/></g>
  <g transform="translate(300, 225)"><use href="#holo-node"/></g>
</svg>
