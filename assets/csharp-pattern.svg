<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <!-- Seamless C# Hologram Pattern Definition -->
    <g id="csharp-logo-main">
      <!-- Hexagon Shield -->
      <polygon points="0,-34 29.4,-17 29.4,17 0,34 -29.4,17 -29.4,-17" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" opacity="0.95"/>
      <polygon points="0,-30 25.9,-15 25.9,15 0,30 -25.9,15 -25.9,-15" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.6"/>
      <!-- 'C' Shape -->
      <path d="M 2,-16 A 17,17 0 1 0 2,16 L 2,10 A 11,11 0 1 1 2,-10 Z" fill="#ffffff" opacity="0.95"/>
      <!-- '#' Sharp Symbol -->
      <!-- Vertical Bars -->
      <line x1="10" y1="-14" x2="8" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="17" y1="-14" x2="15" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <!-- Horizontal Bars -->
      <line x1="4" y1="-5" x2="21" y2="-5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <line x1="4" y1="5" x2="21" y2="5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Mini Accent C# Badge -->
    <g id="csharp-mini">
      <polygon points="0,-16 13.8,-8 13.8,8 0,16 -13.8,8 -13.8,-8" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" opacity="0.7"/>
      <!-- Mini C -->
      <path d="M 0,-7 A 7.5,7.5 0 1 0 0,7 L 0,4.5 A 5,5 0 1 1 0,-4.5 Z" fill="#ffffff" opacity="0.85"/>
      <!-- Mini # -->
      <line x1="4" y1="-6" x2="3" y2="6" stroke="#ffffff" stroke-width="1"/>
      <line x1="7.5" y1="-6" x2="6.5" y2="6" stroke="#ffffff" stroke-width="1"/>
      <line x1="1.5" y1="-2" x2="9.5" y2="-2" stroke="#ffffff" stroke-width="1"/>
      <line x1="1.5" y1="2" x2="9.5" y2="2" stroke="#ffffff" stroke-width="1"/>
    </g>

    <!-- Tech Cyber Hologram Grid Dots & Crosses -->
    <g id="holo-cross">
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>
      <circle cx="0" cy="0" r="1" fill="#ffffff" opacity="0.6"/>
    </g>
  </defs>

  <!-- Background Tech Mesh -->
  <rect width="200" height="200" fill="#000000"/>

  <!-- Subtle Matrix Circuit Lines -->
  <path d="M 0,0 L 200,200 M 200,0 L 0,200" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="1,7" opacity="0.18"/>
  <path d="M 100,0 L 100,200 M 0,100 L 200,100" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2,6" opacity="0.15"/>

  <!-- Center Main C# Logo -->
  <g transform="translate(100, 100)">
    <use href="#csharp-logo-main"/>
  </g>

  <!-- Corner Seamless Tiles (0,0), (200,0), (0,200), (200,200) -->
  <g transform="translate(0, 0)">
    <use href="#csharp-logo-main"/>
  </g>
  <g transform="translate(200, 0)">
    <use href="#csharp-logo-main"/>
  </g>
  <g transform="translate(0, 200)">
    <use href="#csharp-logo-main"/>
  </g>
  <g transform="translate(200, 200)">
    <use href="#csharp-logo-main"/>
  </g>

  <!-- Diamond Positions (Intermediate C# mini emblems) -->
  <g transform="translate(100, 0)">
    <use href="#csharp-mini"/>
  </g>
  <g transform="translate(100, 200)">
    <use href="#csharp-mini"/>
  </g>
  <g transform="translate(0, 100)">
    <use href="#csharp-mini"/>
  </g>
  <g transform="translate(200, 100)">
    <use href="#csharp-mini"/>
  </g>

  <!-- Quadrant Accents (50,50), (150,50), (50,150), (150,150) -->
  <g transform="translate(50, 50)">
    <use href="#csharp-mini"/>
  </g>
  <g transform="translate(150, 50)">
    <use href="#csharp-mini"/>
  </g>
  <g transform="translate(50, 150)">
    <use href="#csharp-mini"/>
  </g>
  <g transform="translate(150, 150)">
    <use href="#csharp-mini"/>
  </g>

  <!-- Tech Grid Reticle Crosshairs -->
  <g transform="translate(50, 0)"><use href="#holo-cross"/></g>
  <g transform="translate(150, 0)"><use href="#holo-cross"/></g>
  <g transform="translate(50, 200)"><use href="#holo-cross"/></g>
  <g transform="translate(150, 200)"><use href="#holo-cross"/></g>
  <g transform="translate(0, 50)"><use href="#holo-cross"/></g>
  <g transform="translate(0, 150)"><use href="#holo-cross"/></g>
  <g transform="translate(200, 50)"><use href="#holo-cross"/></g>
  <g transform="translate(200, 150)"><use href="#holo-cross"/></g>
  <g transform="translate(100, 50)"><use href="#holo-cross"/></g>
  <g transform="translate(100, 150)"><use href="#holo-cross"/></g>
  <g transform="translate(50, 100)"><use href="#holo-cross"/></g>
  <g transform="translate(150, 100)"><use href="#holo-cross"/></g>
</svg>
